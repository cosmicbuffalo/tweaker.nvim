name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "doc/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "doc/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim-version: ["stable", "nightly"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}

      - name: Run tests
        run: |
          nvim --version
          make test

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting with StyLua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ plugin/ tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # selene-action is unmaintained (Node 20), so install the binary directly.
      - name: Lint with Selene
        run: |
          SELENE_VERSION=0.31.0
          curl -fsSL -o /tmp/selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          unzip -o -q /tmp/selene.zip -d /tmp/selene
          chmod +x /tmp/selene/selene
          /tmp/selene/selene --display-style=quiet lua/ plugin/ tests/
